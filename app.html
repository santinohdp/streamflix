<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060810">
<title>StreamFlix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060810;--bg2:#0b0f1a;--surface:#111827;--surface2:#1a2235;--border:#1f2d44;--accent:#e50914;--accent2:#ff3340;--gold:#f5c518;--text:#edf0f7;--muted:#4a5878;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:radial-gradient(ellipse 120% 80% at 50% -20%,#1c040a 0%,var(--bg) 65%)}
.bg-lines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(229,9,20,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(229,9,20,.04) 1px,transparent 1px);background-size:60px 60px}
.bg-glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(229,9,20,.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-60%);pointer-events:none}
.login-wrap{position:relative;z-index:1;width:100%;max-width:400px;animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.login-card{background:rgba(17,24,39,.85);backdrop-filter:blur(20px);border:1px solid var(--border);border-top:2px solid var(--accent);padding:44px 36px 36px}
.logo-block{text-align:center;margin-bottom:36px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:2px;line-height:1}
.logo span{color:var(--accent)}
.logo-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.field input{width:100%;background:rgba(6,8,16,.8);border:1px solid var(--border);color:var(--text);padding:14px 16px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;border-radius:0}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(229,9,20,.1)}
.field input::placeholder{color:var(--muted)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer;transition:all .2s;margin-top:8px;position:relative}
.login-btn:hover{background:var(--accent2)}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{opacity:.5;pointer-events:none}
.login-btn .spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
.login-btn.loading .btn-text{display:none}
.login-btn.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.login-err{display:none;background:#1a0508;border:1px solid #5c1a1f;color:#f87171;padding:12px 14px;font-size:13px;margin-top:14px;line-height:1.5}
.cfg-toggle{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline;width:100%}
.cfg-box{display:none;margin-top:12px}
.cfg-box input{width:100%;background:rgba(6,8,16,.8);border:1px solid var(--border);color:var(--muted);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none}

/* APP */
#app{display:none}
.navbar{background:rgba(6,8,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px}
.nav-logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0}
.nav-username{font-size:13px;color:var(--muted);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s}
.logout-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Hero */
.hero-banner{position:relative;height:260px;overflow:hidden}
.hero-backdrop{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.4);transition:background-image .5s}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,var(--bg) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:20px 18px}
.hero-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;margin-bottom:10px}
.hero-meta{display:flex;align-items:center;gap:12px}
.hero-rating{color:var(--gold);font-size:13px;font-weight:600}
.hero-year{color:var(--muted);font-size:13px}
.hero-btn{background:var(--accent);color:#fff;border:none;padding:9px 22px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;cursor:pointer;transition:background .2s}
.hero-btn:hover{background:var(--accent2)}

/* Tabs */
.tabs{display:flex;padding:0 18px;margin:18px 0 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--muted);padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}

/* Search */
.search-wrap{padding:14px 18px 4px}
.search-input-wrap{position:relative}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 40px 12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:none}

/* Section */
.section{margin:22px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:12px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px}
.section-count{font-size:12px;color:var(--muted)}

/* Cards */
.cards-scroll{display:flex;gap:10px;padding:0 18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.cards-scroll::-webkit-scrollbar{display:none}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px}
@media(min-width:460px){.cards-grid{grid-template-columns:repeat(4,1fr)}}
.card{flex-shrink:0;width:120px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,border-color .18s;aspect-ratio:2/3}
.cards-grid .card{width:100%}
.card:active{transform:scale(.94);border-color:var(--accent)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card-nop{width:100%;height:100%;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.card-nop-icon{font-size:26px}
.card-nop-text{font-size:9px;color:var(--muted);text-align:center;line-height:1.3}
.card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.93));padding:18px 8px 8px}
.card-name{font-size:10px;font-weight:600;line-height:1.3;margin-bottom:2px}
.card-year{font-size:9px;color:var(--muted)}
.card-rating{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.8);color:var(--gold);font-size:10px;font-weight:700;padding:2px 6px}
.card-type{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:8px;font-weight:700;padding:2px 5px;letter-spacing:.5px}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{flex-shrink:0;width:120px;aspect-ratio:2/3}
.cards-grid .skel-card{width:100%}

/* States */
.full-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:var(--muted)}
.spin-big{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--muted)}
.empty-icon{font-size:48px;opacity:.4}
.empty-text{font-size:14px;text-align:center;line-height:1.6;max-width:280px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-bg.open{display:block}
.detail-sheet{min-height:100vh;background:var(--bg);animation:slideUp .3s cubic-bezier(.16,1,.3,1) both}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.detail-topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(6,8,16,.9);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.back-btn{width:36px;height:36px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn:active{border-color:var(--accent)}
.topbar-title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-hero{height:200px;position:relative;overflow:hidden}
.detail-hero-img{width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
.detail-hero-grad{position:absolute;inset:0;background:linear-gradient(transparent,var(--bg) 90%)}
.detail-poster-row{display:flex;gap:16px;padding:18px;margin-top:-40px;position:relative}
.d-poster{width:100px;flex-shrink:0;aspect-ratio:2/3;object-fit:cover;background:var(--surface);border:2px solid var(--border)}
.d-poster-ph{width:100px;flex-shrink:0;aspect-ratio:2/3;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid var(--border)}
.d-info{flex:1;min-width:0;padding-top:40px}
.d-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;line-height:1.1;margin-bottom:10px}
.d-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border:1px solid var(--border);padding:3px 10px;font-size:11px;color:var(--muted)}
.chip.red{border-color:var(--accent);color:var(--accent)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.d-desc{font-size:13px;color:#8899b0;line-height:1.7;padding:0 18px 20px}
.providers-wrap{padding:0 18px 40px}
.prov-title{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-bottom:14px}
.prov-title span{color:var(--accent)}
.no-prov{background:var(--surface);border:1px solid var(--border);padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.no-prov strong{display:block;font-size:22px;margin-bottom:6px;color:var(--text);font-family:'Bebas Neue',sans-serif;letter-spacing:.5px}
.prov-item{background:var(--surface);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s}
.prov-item:active{border-color:var(--accent)}
.prov-name{font-weight:600;font-size:14px;margin-bottom:3px}
.prov-quality{font-size:12px;color:var(--muted)}
.prov-play-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;cursor:pointer;flex-shrink:0}

/* Player */
#player-screen{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column}
#player-screen.open{display:flex}
.player-bar{background:linear-gradient(rgba(0,0,0,.8),transparent);padding:12px 16px;display:flex;align-items:center;gap:12px;position:absolute;top:0;left:0;right:0;z-index:10}
.player-close{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.player-title{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-sub{font-size:11px;color:rgba(255,255,255,.5)}
#main-video{width:100%;height:100%;background:#000}

/* Update banner */
#update-banner{display:none;background:var(--accent);color:#fff;padding:12px 18px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--green);padding:12px 20px;font-size:13px;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{border-left-color:var(--accent)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="bg-lines"></div><div class="bg-glow"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-block">
        <div class="logo">Stream<span>Flix</span></div>
        <div class="logo-sub">Tu entretenimiento sin límites</div>
      </div>
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="inp-user" placeholder="tu_usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="login-btn" id="login-btn" onclick="login()">
        <span class="btn-text">INGRESAR</span>
        <div class="spinner"></div>
      </button>
      <div class="login-err" id="login-err"></div>
      <div class="cfg-box" style="display:block;margin-top:14px">
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:600">URL del Servidor</div>
        <input type="url" id="inp-api" placeholder="http://localhost:5000" style="background:rgba(6,8,16,.8);border:1px solid var(--border);color:var(--text);padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;width:100%">
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="update-banner" onclick="doUpdate()">🔄 Nueva versión disponible — Tocá para actualizar</div>
  <nav class="navbar">
    <div class="nav-logo">Stream<span>Flix</span></div>
    <div class="nav-right">
      <div class="avatar" id="avatar">?</div>
      <span class="nav-username" id="nav-user"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </nav>

  <!-- Hero -->
  <div class="hero-banner">
    <div class="hero-backdrop" id="hero-bg"></div>
    <div class="hero-grad"></div>
    <div class="hero-content">
      <div class="hero-label">⭐ Destacado hoy</div>
      <div class="hero-title" id="hero-title">Cargando...</div>
      <div class="hero-meta">
        <span class="hero-rating" id="hero-rating"></span>
        <span class="hero-year" id="hero-year"></span>
        <button class="hero-btn" onclick="heroClick()">▶ VER AHORA</button>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('trending',this)">🔥 Tendencias</button>
    <button class="tab" onclick="switchTab('movies',this)">🎬 Películas</button>
    <button class="tab" onclick="switchTab('series',this)">📺 Series</button>
    <button class="tab" onclick="switchTab('top',this)">⭐ Top Rated</button>
    <button class="tab" onclick="switchTab('search',this)">🔍 Buscar</button>
  </div>

  <!-- Search -->
  <div class="search-wrap" id="search-wrap" style="display:none">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Buscar película o serie..." oninput="onSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div id="content-area"></div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="detail-modal">
  <div class="detail-sheet">
    <div class="detail-topbar">
      <button class="back-btn" onclick="closeDetail()">←</button>
      <div class="topbar-title" id="d-toptitle"></div>
    </div>
    <div class="detail-hero">
      <img id="d-backdrop" src="" alt="" style="width:100%;height:100%;object-fit:cover;filter:brightness(.4)" onerror="this.style.display='none'">
      <div class="detail-hero-grad"></div>
    </div>
    <div class="detail-poster-row">
      <img class="d-poster" id="d-poster" src="" alt="" onerror="this.style.display='none';document.getElementById('d-poster-ph').style.display='flex'">
      <div class="d-poster-ph" id="d-poster-ph" style="display:none">🎬</div>
      <div class="d-info">
        <div class="d-title" id="d-title"></div>
        <div class="d-chips" id="d-chips"></div>
      </div>
    </div>
    <div class="d-desc" id="d-desc"></div>
    <div class="providers-wrap">
      <div class="prov-title"><span>▶</span> Reproducir en</div>
      <div id="d-providers"></div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div id="player-screen">
  <div class="player-bar">
    <button class="player-close" onclick="closePlayer()">✕</button>
    <div style="flex:1;min-width:0">
      <div class="player-title" id="pl-title"></div>
      <div class="player-sub" id="pl-sub"></div>
    </div>
    <!-- Indicador de bloqueo de anuncios -->
    <div style="font-size:11px;color:#10b981;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);padding:4px 10px;white-space:nowrap;flex-shrink:0">
      🛡 Anuncios bloqueados
    </div>
  </div>
  <!-- Contenedor del reproductor -->
  <div id="player-container" style="flex:1;position:relative;background:#000;overflow:hidden">
    <!-- Capa bloqueadora de clicks que redirigen -->
    <div id="ad-blocker-overlay" style="
      position:absolute;inset:0;z-index:10;
      pointer-events:none;
    "></div>
    <!-- Bloqueador de zona superior e inferior donde suelen estar los ads -->
    <div id="top-ad-block" style="position:absolute;top:0;left:0;right:0;height:60px;z-index:20;pointer-events:all;background:transparent" onclick="return false;"></div>
    <div id="bot-ad-block" style="position:absolute;bottom:0;left:0;right:0;height:60px;z-index:20;pointer-events:all;background:transparent" onclick="return false;"></div>
    <!-- Iframe del reproductor embed -->
    <iframe
      id="main-iframe"
      src=""
      style="width:100%;height:100%;border:none;background:#000"
      allowfullscreen
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    ></iframe>
    <!-- Pantalla de carga -->
    <div id="player-loading" style="
      position:absolute;inset:0;background:#000;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;color:#4a5878;z-index:5;
    ">
      <div style="width:44px;height:44px;border:3px solid #1f2d44;border-top-color:#e50914;border-radius:50%;animation:spin .8s linear infinite"></div>
      <div style="font-size:13px">Cargando reproductor...</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script>
// ════════════════════════════════════════════
//  ⚙️  CONFIGURACIÓN — EDITÁ ESTOS VALORES
// ════════════════════════════════════════════

const TMDB_KEY  = 'c605729151d15d09849a034e1aba962f';           // ← Tu API key de themoviedb.org
const TMDB_BASE = 'https://api.themoviedb.org/3';
const TMDB_IMG  = 'https://image.tmdb.org/t/p';
const TMDB_LANG = 'es-AR';
const APP_VER   = '1.0.0';

// ════════════════════════════════════════════
//  🔗  LINKS — Se cargan automáticamente
//  desde tu backend cuando abrís una peli
// ════════════════════════════════════════════

// Cache local para no pedir links repetidos
const linksCache = {};

// ════════════════════════════════════════════
//  ESTADO GLOBAL
// ════════════════════════════════════════════

let API_URL    = localStorage.getItem('sf_api') || (location.hostname === 'localhost' ? 'http://localhost:5000' : location.origin);
let token      = localStorage.getItem('sf_token');
let userName   = localStorage.getItem('sf_user');
let heroItem   = null;
let curItem    = null;
let hls        = null;
let searchTmr  = null;
let updateUrl  = null;

// ════════════════════════════════════════════
//  INICIO
// ════════════════════════════════════════════

window.onload = async () => {
  document.getElementById('inp-api').value = API_URL;
  if (token) {
    const ok = await verifyToken();
    if (ok) { initApp(); return; }
  }
};

// ════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════

function toggleCfg() {
  const b = document.getElementById('cfg-box');
  b.style.display = b.style.display === 'block' ? 'none' : 'block';
}

async function login() {
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const api  = document.getElementById('inp-api').value.trim().replace(/\/$/,'');
  if (api) { API_URL = api; localStorage.setItem('sf_api', api); }

  document.getElementById('login-err').style.display = 'none';
  if (!user || !pass) { showLoginErr('Completá usuario y contraseña'); return; }

  const btn = document.getElementById('login-btn');
  btn.classList.add('loading'); btn.disabled = true;

  try {
    const r = await fetch(`${API_URL}/api/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username:user, password:pass })
    });
    const d = await r.json();
    if (r.ok && d.success) {
      token = d.token; userName = d.username;
      localStorage.setItem('sf_token', token);
      localStorage.setItem('sf_user', userName);
      initApp();
    } else {
      showLoginErr(d.message || 'Error al iniciar sesión');
    }
  } catch(e) {
    showLoginErr(`No se pudo conectar al servidor: ${API_URL}`);
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

async function verifyToken() {
  try {
    const r = await fetch(`${API_URL}/api/verify`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token })
    });
    const d = await r.json();
    if (d.valid) { userName = d.username; return true; }
  } catch(e) {}
  return false;
}

function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}

function logout() {
  localStorage.removeItem('sf_token'); localStorage.removeItem('sf_user');
  token = null; userName = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  toast('Sesión cerrada');
}

// ════════════════════════════════════════════
//  APP
// ════════════════════════════════════════════

function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('avatar').textContent = (userName||'?')[0].toUpperCase();
  document.getElementById('nav-user').textContent = userName || '';
  checkUpdate();
  loadTab('trending');
}

async function checkUpdate() {
  try {
    const r = await fetch(`${API_URL}/api/version`);
    const d = await r.json();
    if (d.apk_url && d.version !== APP_VER) {
      updateUrl = d.apk_url;
      document.getElementById('update-banner').style.display = 'block';
    }
  } catch(e) {}
}

function doUpdate() { if (updateUrl) window.open(updateUrl,'_blank'); }

// ─── TABS ────────────────────────────────────
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const sw = document.getElementById('search-wrap');
  sw.style.display = tab === 'search' ? 'block' : 'none';
  if (tab === 'search') {
    document.getElementById('content-area').innerHTML = '';
    document.getElementById('search-input').focus();
    return;
  }
  loadTab(tab);
}

// ════════════════════════════════════════════
//  TMDB API
// ════════════════════════════════════════════

async function tmdb(path, params={}) {
  const url = new URL(`${TMDB_BASE}${path}`);
  url.searchParams.set('api_key', TMDB_KEY);
  url.searchParams.set('language', TMDB_LANG);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url);
  if (!r.ok) throw new Error('TMDB error ' + r.status);
  return r.json();
}

async function loadTab(tab) {
  showSkeleton();
  try {
    switch(tab) {
      case 'trending': {
        const d = await tmdb('/trending/all/week');
        setHero(d.results);
        renderSections([{ title:'🔥 En Tendencia', items: d.results }]);
        break;
      }
      case 'movies': {
        const [pop, now] = await Promise.all([
          tmdb('/movie/popular'),
          tmdb('/movie/now_playing')
        ]);
        setHero(pop.results);
        renderSections([
          { title:'🎬 Populares', items: pop.results },
          { title:'🎟 En Cartelera', items: now.results }
        ]);
        break;
      }
      case 'series': {
        const [pop, air] = await Promise.all([
          tmdb('/tv/popular'),
          tmdb('/tv/on_the_air')
        ]);
        setHero(pop.results);
        renderSections([
          { title:'📺 Series Populares', items: pop.results },
          { title:'📡 Al Aire Ahora', items: air.results }
        ]);
        break;
      }
      case 'top': {
        const [mov, tv] = await Promise.all([
          tmdb('/movie/top_rated'),
          tmdb('/tv/top_rated')
        ]);
        setHero(mov.results);
        renderSections([
          { title:'⭐ Películas Mejor Valoradas', items: mov.results },
          { title:'⭐ Series Mejor Valoradas', items: tv.results }
        ]);
        break;
      }
    }
  } catch(e) {
    console.error(e);
    showEmpty('Error al cargar contenido.\nVerificá tu API key de TMDB.');
  }
}

// ─── Hero ────────────────────────────────────
function setHero(items) {
  const item = items.find(i => i.backdrop_path) || items[0];
  if (!item) return;
  heroItem = item;
  document.getElementById('hero-title').textContent = item.title || item.name || '';
  document.getElementById('hero-rating').textContent = item.vote_average ? `★ ${item.vote_average.toFixed(1)}` : '';
  document.getElementById('hero-year').textContent = (item.release_date || item.first_air_date || '').slice(0,4);
  if (item.backdrop_path)
    document.getElementById('hero-bg').style.backgroundImage = `url(${TMDB_IMG}/w780${item.backdrop_path})`;
}

function heroClick() { if (heroItem) openDetailById(heroItem.id, heroItem.media_type || (heroItem.name ? 'tv':'movie')); }

// ─── Render ──────────────────────────────────
function showSkeleton() {
  const skels = Array(8).fill(`<div class="skel-card skeleton"></div>`).join('');
  document.getElementById('content-area').innerHTML =
    `<div class="section"><div class="section-header"><div class="section-title">Cargando...</div></div><div class="cards-scroll">${skels}</div></div>`;
}

function showEmpty(msg) {
  document.getElementById('content-area').innerHTML =
    `<div class="empty"><div class="empty-icon">🎬</div><div class="empty-text">${msg}</div></div>`;
}

function renderSections(sections) {
  document.getElementById('content-area').innerHTML =
    sections.map(s => buildSection(s.title, s.items)).join('');
}

function buildSection(title, items, grid=false) {
  const cls = grid ? 'cards-grid' : 'cards-scroll';
  return `<div class="section">
    <div class="section-header">
      <div class="section-title">${title}</div>
      <div class="section-count">${items.length} títulos</div>
    </div>
    <div class="${cls}">${items.slice(0,20).map(buildCard).join('')}</div>
  </div>`;
}

function buildCard(item) {
  const title  = (item.title || item.name || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
  const year   = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
  const isTV   = item.media_type === 'tv' || (!item.title && item.name);
  const type   = isTV ? 'SERIE' : 'PELI';
  const mtype  = isTV ? 'tv' : 'movie';
  const poster = item.poster_path ? `${TMDB_IMG}/w342${item.poster_path}` : '';
  const imgEl  = poster
    ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.outerHTML='<div class=\\'card-nop\\'><div class=\\'card-nop-icon\\'>🎬</div><div class=\\'card-nop-text\\'>${title}</div></div>'">`
    : `<div class="card-nop"><div class="card-nop-icon">🎬</div><div class="card-nop-text">${title}</div></div>`;
  return `<div class="card" onclick="openDetailById(${item.id},'${mtype}')">
    ${imgEl}
    <div class="card-overlay">
      <div class="card-name">${title}</div>
      <div class="card-year">${year}</div>
    </div>
    ${rating ? `<div class="card-rating">${rating}</div>` : ''}
    <div class="card-type">${type}</div>
  </div>`;
}

// ─── Búsqueda ────────────────────────────────
function onSearch(q) {
  document.getElementById('search-clear').style.display = q ? 'block':'none';
  clearTimeout(searchTmr);
  if (!q.trim()) { document.getElementById('content-area').innerHTML=''; return; }
  searchTmr = setTimeout(() => doSearch(q), 500);
}

async function doSearch(q) {
  showSkeleton();
  try {
    const d = await tmdb('/search/multi', { query:q });
    const items = d.results.filter(i => i.media_type !== 'person' && (i.poster_path || i.backdrop_path));
    if (!items.length) { showEmpty(`Sin resultados para "${q}"`); return; }
    renderSections([{ title:`Resultados: "${q}"`, items }]);
  } catch(e) {
    showEmpty('Error al buscar. Intentá de nuevo.');
  }
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('content-area').innerHTML = '';
}

// ════════════════════════════════════════════
//  DETALLE
// ════════════════════════════════════════════

async function openDetailById(id, type) {
  document.getElementById('detail-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('d-providers').innerHTML = '<div class="full-loader"><div class="spin-big"></div></div>';
  document.getElementById('d-title').textContent = 'Cargando...';
  document.getElementById('d-desc').textContent = '';
  document.getElementById('d-chips').innerHTML = '';

  try {
    const item = await tmdb(`/${type}/${id}`, { append_to_response:'credits' });
    item.media_type = type;
    curItem = item;
    renderDetail(item);
  } catch(e) {
    document.getElementById('d-title').textContent = 'Error al cargar';
  }
}

async function renderDetail(item) {
  const title   = item.title || item.name || '';
  const year    = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating  = item.vote_average ? item.vote_average.toFixed(1) : '';
  const isTV    = item.media_type === 'tv';
  const dur     = item.runtime ? `${item.runtime} min` : (item.number_of_seasons ? `${item.number_of_seasons} temporada${item.number_of_seasons>1?'s':''}` : '');
  const genres  = (item.genres||[]).slice(0,3).map(g=>g.name);

  document.getElementById('d-toptitle').textContent = title;
  document.getElementById('d-title').textContent    = title;
  document.getElementById('d-desc').textContent     = item.overview || 'Sin descripción disponible.';

  // Poster
  const posterEl = document.getElementById('d-poster');
  const posterPh = document.getElementById('d-poster-ph');
  if (item.poster_path) {
    posterEl.src = `${TMDB_IMG}/w342${item.poster_path}`;
    posterEl.style.display = 'block'; posterPh.style.display = 'none';
  } else {
    posterEl.style.display = 'none'; posterPh.style.display = 'flex';
  }

  // Backdrop
  const bd = document.getElementById('d-backdrop');
  bd.src = item.backdrop_path ? `${TMDB_IMG}/w780${item.backdrop_path}` : '';

  // Chips
  document.getElementById('d-chips').innerHTML = [
    rating ? `<span class="chip gold">★ ${rating}</span>` : '',
    year   ? `<span class="chip">${year}</span>` : '',
    dur    ? `<span class="chip">${dur}</span>` : '',
    `<span class="chip red">${isTV ? 'SERIE' : 'PELÍCULA'}</span>`,
    ...genres.map(g=>`<span class="chip">${g}</span>`)
  ].filter(Boolean).join('');

  // Providers
  // Cargar links desde el backend
  document.getElementById('d-providers').innerHTML = '<div class="full-loader"><div class="spin-big"></div></div>';
  const mtype = item.media_type === 'tv' ? 'series' : 'movie';
  try {
    let provs = linksCache[`${mtype}-${item.id}`];
    if (!provs) {
      const r = await fetch(`${API_URL}/api/links/${mtype === 'movie' ? 'movie' : 'tv'}/${item.id}`);
      const d = await r.json();
      provs = d.links || [];
      linksCache[`${mtype}-${item.id}`] = provs;
    }
    // Providers automáticos — sin anuncios, ordenados por limpieza
    const isTV = item.media_type === 'tv';
    const autoProvs = [
      {
        name: 'VidLink',
        quality: 'HD',
        lang: 'Multi',
        url: isTV
          ? `https://vidlink.pro/tv/${item.id}/1/1`
          : `https://vidlink.pro/movie/${item.id}`
      },
      {
        name: 'Embed.su',
        quality: 'HD',
        lang: 'Multi',
        url: isTV
          ? `https://embed.su/embed/tv/${item.id}/1/1`
          : `https://embed.su/embed/movie/${item.id}`
      },
      {
        name: 'AutoEmbed',
        quality: 'HD',
        lang: 'Multi',
        url: isTV
          ? `https://autoembed.co/tv/tmdb/${item.id}-1-1`
          : `https://autoembed.co/movie/tmdb/${item.id}`
      }
    ];

    // Combinar: providers manuales primero, luego automáticos
    const allProvs = [...provs, ...autoProvs];
    linksCache[`${mtype}-${item.id}`] = allProvs;

    document.getElementById('d-providers').innerHTML = allProvs.map((p,i) => `
      <div class="prov-item" onclick="playStream(${i})" style="${i >= provs.length ? 'border-left:2px solid #3b82f6' : ''}">
        <div>
          <div class="prov-name">${p.name}${i >= provs.length ? ' <span style="font-size:10px;color:#3b82f6;font-weight:400;background:rgba(59,130,246,.1);padding:1px 6px">AUTO</span>' : ''}</div>
          <div class="prov-quality">${p.quality}${p.lang ? ' · ' + p.lang : ''}</div>
        </div>
        <button class="prov-play-btn">▶ VER</button>
      </div>`).join('');
  } catch(e) {
    document.getElementById('d-providers').innerHTML = `<div class="no-prov"><strong>⚠ Error</strong>No se pudo conectar al servidor.</div>`;
  }
}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('open');
  document.body.style.overflow = '';
}

// ════════════════════════════════════════════
//  PLAYER
// ════════════════════════════════════════════

function playStream(idx) {
  if (!curItem) return;
  const mtype = curItem.media_type === 'tv' ? 'series' : 'movie';
  const provs  = linksCache[`${mtype}-${curItem.id}`] || [];
  const p = provs[idx];
  if (!p?.url) { toast('Sin URL configurada', true); return; }

  document.getElementById('pl-title').textContent = curItem.title || curItem.name || '';
  document.getElementById('pl-sub').textContent   = `${p.name} · ${p.quality}${p.lang ? ' · ' + p.lang : ''}`;
  document.getElementById('player-loading').style.display = 'flex';

  const iframe = document.getElementById('main-iframe');
  iframe.src = '';
  setTimeout(() => { iframe.src = p.url; }, 100);
  iframe.onload = () => { document.getElementById('player-loading').style.display = 'none'; };

  activateAdBlocker();
  document.getElementById('player-screen').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  document.getElementById('main-iframe').src = '';
  document.getElementById('player-screen').classList.remove('open');
  document.body.style.overflow = '';
  deactivateAdBlocker();
}

// BLOQUEADOR DE ANUNCIOS
let _popupBlocker = null;
let _origOpen = null;

function activateAdBlocker() {
  // 1. Bloquear window.open completamente
  _origOpen = window.open;
  window.open = (url) => {
    console.log('[AdBlock] Popup bloqueado:', url);
    window.focus();
    return null;
  };

  // 2. Cuando el iframe roba el foco (click en ad), volvemos el foco a la ventana principal
  const iframe = document.getElementById('main-iframe');
  _focusInterval = setInterval(() => {
    try {
      if (document.activeElement === iframe) {
        // El iframe tiene el foco — puede estar por abrir un popup
        // Lo dejamos un frame para que el video funcione, pero bloqueamos navegación
      }
    } catch(e) {}
  }, 100);

  // 3. Detectar cuando la ventana pierde foco (señal de que se abrió un popup)
  window.addEventListener('blur', onWindowBlur);

  // 4. Bloquear links externos en nuestra página
  document.addEventListener('click', blockRedirectClicks, true);

  // 5. MutationObserver para iframes y overlays nuevos
  _popupBlocker = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (!node.tagName) return;
        if (node.tagName === 'IFRAME' && node.id !== 'main-iframe') { node.remove(); return; }
        const style = node.getAttribute && node.getAttribute('style') || '';
        if ((style.includes('z-index: 9') || style.includes('z-index:9')) && !node.id) node.remove();
      });
    });
  });
  _popupBlocker.observe(document.body, { childList: true, subtree: false });
  window.addEventListener('beforeunload', preventNav);
}

let _focusInterval = null;
let _lastBlur = 0;

function onWindowBlur() {
  _lastBlur = Date.now();
  // Si perdemos el foco, en 300ms cerramos cualquier pestaña nueva y volvemos
  setTimeout(() => {
    window.focus();
  }, 50);
}

function deactivateAdBlocker() {
  if (_origOpen) { window.open = _origOpen; _origOpen = null; }
  if (_popupBlocker) { _popupBlocker.disconnect(); _popupBlocker = null; }
  if (_focusInterval) { clearInterval(_focusInterval); _focusInterval = null; }
  document.removeEventListener('click', blockRedirectClicks, true);
  window.removeEventListener('blur', onWindowBlur);
  window.removeEventListener('beforeunload', preventNav);
}

function blockRedirectClicks(e) {
  const a = e.target.closest('a');
  if (a && a.href && a.target === '_blank') {
    const safe = ['themoviedb', 'image.tmdb', 'localhost'];
    if (!safe.some(d => a.href.includes(d))) {
      e.preventDefault(); e.stopPropagation();
    }
  }
}

function preventNav(e) { e.preventDefault(); e.returnValue = ''; }

// ─── Toast ────────────────────────────────────
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (isErr?' err':'');
  clearTimeout(window._t);
  window._t = setTimeout(()=>el.className='', 3000);
}
